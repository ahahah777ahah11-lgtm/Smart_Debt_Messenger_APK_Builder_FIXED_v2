name: Build Smart Debt Messenger APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [[ -f app/build.gradle && -f settings.gradle ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [[ -f html-to-apk-builder/app/build.gradle && -f html-to-apk-builder/settings.gradle ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/html-to-apk-builder"
          else
            echo 'ERROR: Could not find app/build.gradle and settings.gradle.'
            echo 'Repository root contents:'
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/assets/www/index.html"

      - name: Build Debug APK
        shell: bash
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Debt-Messenger-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            html-to-apk-builder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        shell: bash
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Debt-Messenger-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            html-to-apk-builder/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
